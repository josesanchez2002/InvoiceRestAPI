# Enable H2 console to verify data via browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Database connection configuration
spring.datasource.url=jdbc:h2:mem:invoicedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from entities first
spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.hibernate.ddl-auto=update

# CRITICAL: Defer running data.sql until Hibernate finishes creating tables
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true